# Rendered by highfivelabs/krm-ci ci/krm/sync.py from ci/krm/callers/; do
# not edit here. The weekly whole-repository security scan, CodeQL and
# OpenSSF Scorecard, in krm-ci's krm-security.yml (docs/krm-ci.md).
name: hfl-security

on:
  schedule:
    - cron: "@@{security_cron}"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: hfl-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  krm:
    uses: highfivelabs/krm-ci/.github/workflows/krm-security.yml@@@{ci_ref} # @@{ci_tag}
    permissions:
      contents: read
      id-token: write
      issues: write
      security-events: write
    with:
      ci-ref: @@{ci_ref}
      setup-command: @@{lint_setup}
