live_command = "task live:sandbox:grafana && task live:grafana"
sweep = "task live:sandbox:grafana:down"
security_cron = "20 7 * * 2"

[[repo]]
name = "mongodbatlas-krm-extensions"
profile = "vendor"
security_cron = "30 7 * * 2"

[[repo]]
name = "okta-krm-extensions"
profile = "vendor"
security_cron = "40 7 * * 2"

[[repo]]
name = "pagerduty-krm-extensions"
profile = "vendor"
security_cron = "50 7 * * 2"

[[repo]]
name = "sentry-krm-extensions"
profile = "vendor"
