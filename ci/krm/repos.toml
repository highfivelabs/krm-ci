#
# Every repository on the KRM CI baseline (docs/krm-ci.md), and what is
# particular to it. ci/krm/sync.py renders each one's caller workflows
# (.github/workflows/hfl-*.yml) and .github/dependabot.yml from
# ci/krm/callers/ with these values. Adding a repository is one [[repo]]
# entry (Amazon's ACK onboards a controller with one line the same way).
#
# A repository takes its profile's values; its own keys override them.
#
#   check, setup, e2e       commands run by krm-ci.yml (bash, in the checkout)
#   free_disk, sibling,     see krm-ci.yml's inputs
#   sibling_ref
#   live                    render hfl-live.yml at all (false until the repository's
#                           live command and sweep keep the contract below)
#   live_cloud              gcp | aws | azure | none (a local sandbox)
#   live_command, sweep     run by krm-live.yml; KRM_LIVE_KINDS, LIVE_RUN_ID set.
#                           The contract: everything the live command makes is
#                           named or tagged with LIVE_RUN_ID, and sweep deletes
#                           what carries it.
#   timeout                 minutes for krm-ci.yml's test and e2e jobs
#   live_timeout            minutes
#   security_cron           the weekly scan's schedule, spread so the
#                           repositories don't all run at once
#
# Live runs stay off in a repository until its variable HFL_LIVE_ENABLED is
# 'true': set it once the cloud trusts the repository's `live` environment
# (docs/krm-ci.md, "Cloud trust").

[profile.vendor]
live = true
setup = ""
# hack/ci.sh is the repository's own check (generated files current, build,
# vet with and without -tags live, test), the one people run locally; RUNTIME
# is the sibling checkout, so it generates with the pinned runtime.
check = '''python3 -m venv "${RUNNER_TEMP}/py" && "${RUNNER_TEMP}/py/bin/pip" install -q pyyaml==6.0.3 && export PATH="${RUNNER_TEMP}/py/bin:${PATH}" && RUNTIME="${PWD}/../krm-rest-runtime" hack/ci.sh'''
e2e = ""
free_disk = false
timeout = 30
sibling = "krm-rest-runtime"
# The runtime commit whose generator (gen/) the repositories' generated
# files match; a full SHA, since krm-rest-runtime has no tags. go.mod pins the
# runtime's Go packages separately. Move this when the runtime's generator
# changes, regenerating every vendor repository in the same rollout.
sibling_ref = "7439d5548d68dd401cdf0eda6471c1df3f058d2f"
live_cloud = "gcp"
live_command = 'go test -tags live -run TestEveryKindLive -timeout "$(( ${LIVE_TIMEOUT_MINUTES} - 5 ))m" -v .'
sweep = ""
live_timeout = 45

# Each operator repository's hack/ci/pr.sh plans from the changed paths
# (its hack/ci/select.sh, BASE_SHA..HEAD_SHA; a push runs everything) and
# installs its tools only when something runs: `check` is task ci:check for
# the plan, `e2e` is task operator-e2e when the plan asks for it.
# Live off until each repository's live run keeps the LIVE_RUN_ID contract:
# their run scripts make their own run IDs (cce-…, ackx-…) and sweep by
# those, and their credentials come from offload VMs today (review round 1,
# R3).
[profile.operator]
live = false
live_cloud = "none"
live_command = ""
setup = ""
check = "hack/ci/pr.sh check"
e2e = "hack/ci/pr.sh e2e"
free_disk = true
timeout = 90
sibling = ""
sibling_ref = ""
live_timeout = 60
sweep = ""

# The runtime has no live run of its own; the vendor repositories' live
# runs exercise it.
[profile.runtime]
live = false
setup = ""
check = "hack/ci.sh"
e2e = ""
free_disk = false
timeout = 20
sibling = ""
sibling_ref = ""
live_cloud = "gcp"
live_command = ""
sweep = ""
live_timeout = 30

[[repo]]
name = "config-connector-extensions"
profile = "operator"
live_cloud = "gcp"
security_cron = "40 7 * * 1"

[[repo]]
name = "ack-extensions"
profile = "operator"
live_cloud = "aws"
# e2e also runs the ACK controllers against the moto emulator.
timeout = 180
security_cron = "40 8 * * 1"

[[repo]]
name = "aso-extensions"
profile = "operator"
live_cloud = "azure"
security_cron = "40 9 * * 1"

[[repo]]
name = "krm-rest-runtime"
profile = "runtime"
security_cron = "10 6 * * 2"

[[repo]]
name = "cloudflare-krm-extensions"
profile = "vendor"
security_cron = "20 6 * * 2"

[[repo]]
name = "confluent-krm-extensions"
profile = "vendor"
