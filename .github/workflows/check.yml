#
# krm-ci's own check: hack/check.sh, as `task check` runs it. Safe for
# forks: pull_request, a read-only token, no secrets.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ github.token }}
      - name: Tools
        run: ci/krm/tools.sh actionlint zizmor
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/check.sh
