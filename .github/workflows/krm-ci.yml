#
# The KRM CI baseline's pull-request checks (docs/krm-ci.md), called from
# each extension repository's hfl-ci.yml (rendered by ci/krm/sync.py).
#
#   lint   actionlint and zizmor on the repository's workflows; gofmt and
#          golangci-lint (on a pull request, only what it changes); gitleaks
#          on the pull request's commits; govulncheck, failing on a
#          reachable vulnerability the pull request adds; GitHub's
#          dependency review (public repositories).
#   test   the repository's own hermetic check (inputs.check-command): its
#          generated-files drift check, the build, the tests against its
#          fake cloud or recorded cassettes. No secrets, no cloud.
#          Licences (taskfiles/licenses.yml): before it, no MPL, GPL, AGPL,
#          LGPL, SSPL or BUSL licence header in the repository's own files;
#          after it, every Go module linked into inputs.licenses-packages
#          under an accepted licence (permissive, or MPL-2.0 linked
#          unmodified), on a push and on a pull request that changes go.mod.
#   e2e    the repository's kind end-to-end test, when it has one.
#   plan   whether test and e2e run at all, and test's shards. On a pull
#          request whose head already has the repository's pre-push gate
#          status (offload/ci: hack/ci/gate.sh ran this same check and e2e
#          on that commit, on an offload VM) posted by a person, they are
#          skipped (gate.py offload). Pushes to main always run them, with
#          BASE_SHA set to the push's before, so a selective check judges
#          what the push brought (the merge, as merged); the nightly run
#          covers everything.
#          test-shards > 1 runs test as that many jobs, each with
#          KRM_SHARD and KRM_SHARDS set (ci/krm/shard.sh lists a shard's
#          packages); the licence steps run in shard 1 only.
#   ci     the one status branch protection requires: fails if any job
#          above failed or was cancelled; a skipped job is fine
#          (Config Connector's presubmit-gatekeeper).
#
# Safe for a pull request from a fork: it runs on `pull_request`, so it gets
# no secrets and a read-only token, and nothing here asks for more.
name: krm-ci

on:
  workflow_call:
    inputs:
      ci-ref:
        description: The commit of highfivelabs/krm-ci this workflow is called at (the same SHA as in `uses:`); its ci/krm/ scripts and configs are used
        type: string
        required: true
      check-command:
        description: The repository's hermetic check. BASE_SHA and HEAD_SHA are set for a selective run.
        type: string
        default: task ci:check
      lint-setup-command:
        description: Runs in the lint job before golangci-lint and govulncheck, which load the packages (an operator repository's upstream checkout); Task is installed when set
        type: string
        default: ""
      setup-command:
        description: Runs before check-command and e2e-command (tools, upstream checkout)
        type: string
        default: ""
      e2e-command:
        description: The kind end-to-end test; empty for none. BASE_SHA and HEAD_SHA are set, as for check-command, so it can skip itself.
        type: string
        default: ""
      runs-on:
        description: The runner for test and e2e
        type: string
        default: ubuntu-latest
      timeout-minutes:
        type: number
        default: 60
      free-disk:
        description: Remove the runner's unused SDKs first (about 30 GB), for repositories with a large module graph
        type: boolean
        default: false
      sibling-repo:
        description: Another repository of this organisation (its name) checked out beside this one, for repositories whose scripts read ../<name>
        type: string
        default: ""
      sibling-ref:
        type: string
        default: ""
      golangci:
        type: boolean
        default: true
      govulncheck:
        type: boolean
        default: true
      go-packages:
        description: The packages golangci-lint and govulncheck look at
        type: string
        default: ./...
      govulncheck-packages:
        description: The packages govulncheck looks at, when not go-packages (an operator repository's binaries; ./... loads the whole upstream tree and exhausts the runner)
        type: string
        default: ""
      licenses-packages:
        description: The packages whose linked Go modules' licences are checked after the hermetic check (taskfiles/licenses.yml); empty checks only file headers
        type: string
        default: ./...
      test-shards:
        description: How many jobs the test job is split into (1 to 16); the check command reads KRM_SHARD and KRM_SHARDS (ci/krm/shard.sh)
        type: number
        default: 1
      trust-offload-status:
        description: On a pull request, skip test and e2e when the head commit has a successful offload/ci status posted by a person (the repository's pre-push gate ran them there)
        type: boolean
        default: true

permissions: {}

env:
  KRM_TOOLS: ${{ github.workspace }}/.hfl-tools

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/${{ github.event.repository.name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: highfivelabs/krm-ci
          ref: ${{ inputs.ci-ref }}
          path: .hfl-ci
          sparse-checkout: ci/krm
          persist-credentials: false
      - if: inputs.sibling-repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.sibling-repo }}
          ref: ${{ inputs.sibling-ref }}
          path: src/${{ inputs.sibling-repo }}
          persist-credentials: false
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/${{ github.event.repository.name }}/go.mod
          cache-dependency-path: src/${{ github.event.repository.name }}/go.sum
      # The Go version is in the key: govulncheck is built with it (tools.sh).
      - name: Lint and security tools (pinned, checksummed)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KRM_TOOLS }}
          key: krm-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('.hfl-ci/ci/krm/tools.sh') }}
      - run: ../../.hfl-ci/ci/krm/tools.sh && echo "${KRM_TOOLS}" >> "${GITHUB_PATH}"
      - if: inputs.lint-setup-command != ''
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ github.token }}
      - name: Packages' prerequisites (lint-setup-command)
        if: inputs.lint-setup-command != ''
        env:
          CMD: ${{ inputs.lint-setup-command }}
        run: bash -euo pipefail -c "${CMD}"

      - name: The range this run judges
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request is judged on what it adds over its merge base; a
          # push on what it pushed (before..after), like a pull request.
          # What is already there is the weekly security workflow's to
          # report (krm-security.yml), so main does not go red on old
          # findings. A push with no usable before (a new branch, a forced
          # push whose old head is gone) is judged whole.
          base=""
          if [[ "${EVENT}" == "pull_request" ]]; then
            base="$(git merge-base "${BASE}" "${HEAD}")"
          elif [[ "${EVENT}" == "push" && -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ ]] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="${BEFORE}"
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"

      - name: Workflows (actionlint, zizmor)
        if: hashFiles(format('src/{0}/.github/**', github.event.repository.name)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actionlint -shellcheck=
          # Online audits (impostor commits, ref confusion) read GitHub with
          # the job's read-only token.
          zizmor --config ../../.hfl-ci/ci/krm/zizmor.yml --min-severity medium --format github .github

      - name: gofmt
        run: |
          out="$(git ls-files -z '*.go' ':!:third_party/**' | xargs -0 -r gofmt -l)"
          if [[ -n "${out}" ]]; then echo "${out}"; echo "::error::gofmt needed (gofmt -w the files above)"; exit 1; fi

      - name: golangci-lint
        if: inputs.golangci
        env:
          BASE: ${{ steps.range.outputs.base }}
          PKGS: ${{ inputs.go-packages }}
        run: |
          set -euo pipefail
          cfg=.golangci.yml
          [[ -f "${cfg}" || -f .golangci.yaml ]] || cfg=../../.hfl-ci/ci/krm/golangci.yml
          [[ -f .golangci.yaml ]] && cfg=.golangci.yaml
          args=(run --config "${cfg}")
          [[ -n "${BASE}" ]] && args+=(--new-from-merge-base "${BASE}")
          # shellcheck disable=SC2086
          golangci-lint "${args[@]}" ${PKGS}

      - name: Secrets in the pull request's commits (gitleaks)
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          cfg=../../.hfl-ci/ci/krm/gitleaks.toml
          [[ -f .gitleaks.toml ]] && cfg=.gitleaks.toml
          opts="--log-opts=-n 200"
          [[ -n "${BASE}" ]] && opts="--log-opts=${BASE}..HEAD"
          gitleaks git --no-banner --redact --config "${cfg}" "${opts}" .

      - name: Reachable vulnerabilities this change adds (govulncheck)
        if: inputs.govulncheck
        env:
          BASE: ${{ steps.range.outputs.base }}
          PKGS: ${{ inputs.govulncheck-packages || inputs.go-packages }}
        run: |
          set -euo pipefail
          gate=../../.hfl-ci/ci/krm/gate.py
          # shellcheck disable=SC2086
          govulncheck -format json ${PKGS} > "${RUNNER_TEMP}/head.json" || true
          if [[ -n "${BASE}" ]]; then
            git worktree add -q "${RUNNER_TEMP}/base" "${BASE}"
            # shellcheck disable=SC2086
            (cd "${RUNNER_TEMP}/base" && govulncheck -format json ${PKGS} > "${RUNNER_TEMP}/base.json" 2>/dev/null) || true
          else
            : > "${RUNNER_TEMP}/base.json"
          fi
          result="$(python3 -I "${gate}" vulns --base "${RUNNER_TEMP}/base.json" --head "${RUNNER_TEMP}/head.json")" && rc=0 || rc=$?
          echo "${result}"
          {
            echo "### govulncheck"
            echo '```json'
            echo "${result}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # On main, the nightly security workflow reports what is already
          # there; a pull request fails only on what it adds.
          if [[ -n "${BASE}" && "${rc}" -ne 0 ]]; then
            echo "::error::this change adds reachable vulnerabilities (above); update the module or avoid the call"
            exit 1
          fi

      - name: Dependency review
        if: github.event_name == 'pull_request' && !github.event.repository.private
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      gated: ${{ steps.offload.outputs.gated }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          N: ${{ inputs.test-shards }}
        run: |
          set -euo pipefail
          if ! [[ "${N}" =~ ^([1-9]|1[0-6])$ ]]; then
            echo "::error::test-shards is ${N}; 1 to 16"
            exit 1
          fi
          echo "shards=[$(seq -s, 1 "${N}")]" >> "${GITHUB_OUTPUT}"
      - if: inputs.trust-offload-status && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: highfivelabs/krm-ci
          ref: ${{ inputs.ci-ref }}
          path: .hfl-ci
          sparse-checkout: ci/krm
          persist-credentials: false
      # The rule is krm-ci's (gate.py, at ci-ref), never the pull request's.
      # Any failure to read the statuses means test and e2e run.
      - id: offload
        if: inputs.trust-offload-status && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          gated=false
          d=""
          if gh api "repos/${REPO}/commits/${SHA}/statuses?per_page=100" > "${RUNNER_TEMP}/statuses.json"; then
            if d="$(python3 -I .hfl-ci/ci/krm/gate.py offload --statuses "${RUNNER_TEMP}/statuses.json" --sha "${SHA}")"; then
              gated=true
            fi
          fi
          reason="$(jq -r '.reason // empty' <<<"${d}" 2>/dev/null || true)"
          echo "gated=${gated}" >> "${GITHUB_OUTPUT}"
          if [[ "${gated}" == true ]]; then
            echo "test and e2e skipped: ${reason}" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "test and e2e run: ${reason:-could not read the statuses}"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.gated != 'true'
    # A plain name: GitHub doesn't evaluate a skipped job's name, so an
    # expression here shows as its source when plan skips the job. With
    # shards, GitHub appends the shard: "test (1)", "test (2)", ...
    name: test
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/${{ github.event.repository.name }}
    steps:
      - if: inputs.free-disk && runner.environment == 'github-hosted'
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/${{ github.event.repository.name }}
          fetch-depth: 0
          persist-credentials: false
      - if: inputs.sibling-repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.sibling-repo }}
          ref: ${{ inputs.sibling-ref }}
          path: src/${{ inputs.sibling-repo }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/${{ github.event.repository.name }}/go.mod
          cache-dependency-path: src/${{ github.event.repository.name }}/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ github.token }}
      - if: inputs.setup-command != ''
        env:
          CMD: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "${CMD}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: highfivelabs/krm-ci
          ref: ${{ inputs.ci-ref }}
          path: .hfl-ci
          sparse-checkout: |
            taskfiles
            ci/krm
          persist-credentials: false
      - name: Licences (file headers)
        if: matrix.shard == 1
        run: task --taskfile ../../.hfl-ci/taskfiles/licenses.yml headers
      - name: Hermetic check
        env:
          CMD: ${{ inputs.check-command }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KRM_SHARD: ${{ matrix.shard }}
          KRM_SHARDS: ${{ inputs.test-shards }}
          KRM_CI_DIR: ${{ github.workspace }}/.hfl-ci
        run: |
          set -euo pipefail
          # A push is judged on what it pushed (before..after), as a pull
          # request is on its base; the repository's nightly run covers
          # everything. A push with no usable before runs everything.
          if [[ -z "${BASE_SHA}" && "${EVENT}" == push && -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ ]] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            export BASE_SHA="${BEFORE}"
          fi
          bash -euo pipefail -c "${CMD}"
      # After the check: an operator repository's packages load only once
      # its check has fetched the upstream checkout. A pull request that
      # changes no go.mod, go.sum or .licenses-allow.txt links the same
      # modules as its base, so it skips this; a push checks everything.
      - name: Licences (linked Go modules)
        if: inputs.licenses-packages != '' && matrix.shard == 1
        env:
          PKGS: ${{ inputs.licenses-packages }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == pull_request ]]; then
            changed="$(git diff --name-only "$(git merge-base "${BASE}" HEAD)" HEAD)"
            if ! grep -Eq '(^|/)go\.(mod|sum)$|(^|/)\.licenses-allow\.txt$' <<<"${changed}"; then
              echo "licences: no go.mod, go.sum or .licenses-allow.txt changed; the linked modules are the base's"
              exit 0
            fi
          fi
          task --taskfile ../../.hfl-ci/taskfiles/licenses.yml deps PKGS="${PKGS}"
      - name: Generated files are committed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::the check changed or created files above: regenerate and commit them"
            exit 1
          fi

  e2e:
    needs: plan
    if: inputs.e2e-command != '' && needs.plan.outputs.gated != 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/${{ github.event.repository.name }}
    steps:
      - if: inputs.free-disk && runner.environment == 'github-hosted'
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/${{ github.event.repository.name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/${{ github.event.repository.name }}/go.mod
          cache-dependency-path: src/${{ github.event.repository.name }}/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ github.token }}
      - if: inputs.setup-command != ''
        env:
          CMD: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "${CMD}"
      - name: End-to-end
        env:
          CMD: ${{ inputs.e2e-command }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A push is judged on what it pushed (before..after), as a pull
          # request is on its base; the repository's nightly run covers
          # everything. A push with no usable before runs everything.
          if [[ -z "${BASE_SHA}" && "${EVENT}" == push && -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ ]] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            export BASE_SHA="${BEFORE}"
          fi
          bash -euo pipefail -c "${CMD}"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 100 || true

  ci:
    needs: [plan, lint, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan, lint, test, e2e: ${RESULTS}"
          for r in ${RESULTS}; do
            case "${r}" in success|skipped) ;; *) exit 1 ;; esac
          done
