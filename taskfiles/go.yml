#
# Tasks every High Five Labs Go repository can include: nothing here names
# a repository. The extension repositories include this file remotely,
# pinned to a tag of this repository and the file's checksum
# (taskfiles/README.md):
#
#   includes:
#     go:
#       taskfile: https://github.com/highfivelabs/factory.git//taskfiles/go.yml?ref=taskfiles/v1.0.0
#       checksum: <sha256 of this file at that tag>
#       vars: {BIN: "{{.ROOT_DIR}}/bin"}
version: '3'

tasks:
  # go install a tool into BIN, once (the binary's presence is the check).
  # Vars: BIN, NAME (the binary), PKG (path@version).
  install-tool:
    internal: true
    requires:
      vars: [BIN, NAME, PKG]
    status:
      - test -x "{{.BIN}}/{{.NAME}}"
    cmds:
      - GOBIN="{{.BIN}}" go install {{.PKG}}

  # Fail if any Go file under DIRS (space-separated) needs gofmt.
  fmt-check:
    requires:
      vars: [DIRS]
    cmds:
      - |
        out="$(gofmt -l {{.DIRS}})"
        if [ -n "$out" ]; then echo "$out"; echo "gofmt needed"; exit 1; fi

  # Fail if the working tree differs from the index or has untracked files
  # under PATHS (space-separated): generated output must be committed.
  # Vars: PATHS, WHAT (what the paths hold, for the message; default
  # "generated files"), HINT (what to run; default "the generator").
  committed:
    requires:
      vars: [PATHS]
    cmds:
      - |
        git diff --exit-code -- {{.PATHS}} || { echo "{{.WHAT | default "generated files"}} are stale; commit the output of {{.HINT | default "the generator"}}"; exit 1; }
        untracked="$(git ls-files --others --exclude-standard -- {{.PATHS}})"
        if [ -n "$untracked" ]; then echo "$untracked"; echo "files under {{.PATHS}} are not committed"; exit 1; fi

  # Run a command with envtest's assets found (KUBEBUILDER_ASSETS), or fail
  # rather than pass with the envtest tests skipped. The download is
  # retried: GitHub's release downloads sometimes answer 5xx.
  # Vars: BIN (holding setup-envtest), ENVTEST_K8S_VERSION; then either
  # CMD (a shell command to run instead of go test, such as one that sets
  # an environment variable for the tests) or PKGS (default ./...) and
  # TIMEOUT (default 30m: go test's own 10m stops a package whose tests run
  # one after another a few minutes short of finishing).
  test-envtest:
    requires:
      vars: [BIN, ENVTEST_K8S_VERSION]
    vars:
      RUN: '{{.CMD | default (printf "go test %s -count=1 -timeout %s" (.PKGS | default "./...") (.TIMEOUT | default "30m"))}}'
    cmds:
      - |
        assets=""
        for i in 1 2 3 4 5; do
          assets="$("{{.BIN}}/setup-envtest" use {{.ENVTEST_K8S_VERSION}} --bin-dir "{{.BIN}}/envtest" -p path)" && [ -n "$assets" ] && break
          assets=""; echo "setup-envtest failed (attempt $i); retrying"; sleep $((i * 10))
        done
        [ -n "$assets" ] || { echo "no envtest assets for {{.ENVTEST_K8S_VERSION}}: refusing to run with the end-to-end tests skipped"; exit 1; }
        export KUBEBUILDER_ASSETS="$assets"
        echo "KUBEBUILDER_ASSETS=$assets" {{.RUN | quote}}
        {{.RUN}}
